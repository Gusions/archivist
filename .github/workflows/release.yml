name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,     target: aarch64-apple-darwin,     name: archivist-macos-arm64 }
          - { os: macos-latest,     target: x86_64-apple-darwin,      name: archivist-macos-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,  name: archivist-windows-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: archivist-linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo test --release --target ${{ matrix.target }}
      - run: cargo build --release --features window --target ${{ matrix.target }}
      - name: macOS app bundle and dmg
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          ./make-dmg.sh
          mkdir -p dmg && cp dist/Archivist.dmg dmg/Archivist-macOS-arm64.dmg
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'aarch64-apple-darwin'
        with: { name: archivist-macos-arm64-dmg, path: dmg }
      - name: Package
        shell: bash
        run: |
          rm -rf dist && mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then cp target/${{ matrix.target }}/release/archivist.exe dist/; else cp target/${{ matrix.target }}/release/archivist dist/; fi
          cp README.md dist/
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: dist }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Zip
        run: cd artifacts && for d in */; do n=${d%/}; case "$n" in *-dmg) continue;; esac; zip -qr "$n.zip" "$n"; done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/archivist-macos-arm64-dmg/Archivist-macOS-arm64.dmg
