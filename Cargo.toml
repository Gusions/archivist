[package]
name = "archivist"
version = "0.1.0"
edition = "2021"
description = "Backup incrementale, deduplicato e compresso (lossless) per vault Obsidian"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fastcdc = "3"
filetime = "0.2"
globset = "0.4"
open = "5"
rand = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
tao = { version = "0.37.2", optional = true }
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
walkdir = "2"
wry = { version = "0.57.2", optional = true }
zstd = { version = "0.13", features = ["zstdmt"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", optional = true }

[features]
# Finestra nativa (WebKit di sistema su macOS, WebView2 su Windows). Build: cargo build --release --features window
window = ["dep:wry", "dep:tao", "dep:muda"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
